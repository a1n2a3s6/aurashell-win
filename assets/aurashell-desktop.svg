  <defs>
    <linearGradient id="sonomaWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="35%" stop-color="#1C2541" />
      <stop offset="72%" stop-color="#0F3443" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
