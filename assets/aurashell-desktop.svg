    <linearGradient id="weatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <style>
      .island-morph { animation: islandBreath 5.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; transform-origin: 600px 44px; }
      .eq1 { animation: eq 0.7s ease-in-out infinite alternate; }
      .eq2 { animation: eq 0.55s ease-in-out 0.15s infinite alternate; }
      .eq3 { animation: eq 0.8s ease-in-out 0.3s infinite alternate; }
      .dock-pop { animation: dockBounce 3.2s ease-in-out infinite; transform-origin: 560px 506px; }
      @keyframes islandBreath {
        0%, 24% { transform: scaleX(0.76) scaleY(0.84); }
        42%, 80% { transform: scaleX(1) scaleY(1); }
        100% { transform: scaleX(0.76) scaleY(0.84); }
      }
      @keyframes eq {
        0% { height: 6px; y: 40px; }
        100% { height: 22px; y: 24px; }
      }
      @keyframes dockBounce {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-10px) scale(1.22); }
      }
    </style>
  </defs>

  
